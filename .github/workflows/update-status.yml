name: Observe services and publish status

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: yomumi-status-primary
  cancel-in-progress: false

jobs:
  visitor:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      observation: ${{ steps.visit.outputs.observation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Visit the public homepage in a clean Chrome profile
        id: visit
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: xvfb-run -a node scripts/visitor-check.mjs
  monitor:
    needs: visitor
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout current main for the next observation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Only this job persists GITHUB_TOKEN, for its one-file commit.
          persist-credentials: true
      - name: Install pinned Bun for fixture build checks
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Verify fixture-only monitor, client and build contracts
        run: node --test tests/*.test.mjs
      - name: Record actual service observations
        id: systems
        continue-on-error: true
        env:
          STATUS_API_BASE_URL: ${{ secrets.STATUS_API_BASE_URL }}
          STATUS_SERVICE_PROBE_URL: ${{ secrets.STATUS_SERVICE_PROBE_URL }}
          STATUS_SERVICE_PROBE_TOKEN: ${{ secrets.STATUS_SERVICE_PROBE_TOKEN }}
        run: node scripts/monitor.mjs
      - name: Persist the external browser's independently timed observation
        env:
          GUEST_OBSERVATION: ${{ needs.visitor.outputs.observation }}
        run: node scripts/persist-visitor.mjs
      - name: Commit only validated public observations
        shell: bash
        env:
          SYSTEM_CHECK: ${{ steps.systems.outcome }}
          VISITOR_OBSERVED: ${{ needs.visitor.outputs.observation != '' }}
        run: |
          set -euo pipefail
          if [[ "$SYSTEM_CHECK" != success && "$VISITOR_OBSERVED" != true ]]; then exit 1; fi
          git add -- public/status.json public/visitor.json
          if git diff --cached --quiet -- public/status.json public/visitor.json; then exit 0; fi
          git diff --cached --check -- public/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(status): record observed service checks' --only -- public/status.json public/visitor.json
          # GITHUB_TOKEN pushes do not recursively trigger the push workflow.
          # A concurrent remote update rejects this push; never overwrite or force-push it.
          git push origin HEAD:main

  deploy:
    needs: monitor
    # Initial/source pushes can publish Unknown without the monitoring secret.
    # A failed/manual/scheduled probe retains the previously deployed timestamped snapshot.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.monitor.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current published source and snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install locked server dependencies for source verification
        if: github.event_name == 'push'
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Verify fixture-only monitor, client, build and Elysia contracts on source changes
        if: github.event_name == 'push'
        run: bun --no-env-file run test
      - name: Enable HTTPS when the custom certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if timeout 20s gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -F https_enforced=true >/dev/null 2>&1; then
            echo 'HTTPS enforcement enabled.'
          else
            echo 'HTTPS enforcement pending certificate readiness; deployment continues.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build independent static assets
        run: bun --no-env-file run build
      - name: Upload small Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Deploy independent status page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
