name: Observe services and publish status

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: yomumi-status-primary
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout current main for the next observation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Only this job persists GITHUB_TOKEN, for its one-file commit.
          persist-credentials: true
      - name: Verify fixture-only monitor and history contracts
        run: node --test tests/*.test.mjs
      - name: Record actual service observations
        env:
          STATUS_API_BASE_URL: ${{ secrets.STATUS_API_BASE_URL }}
          STATUS_SERVICE_PROBE_URL: ${{ secrets.STATUS_SERVICE_PROBE_URL }}
          STATUS_SERVICE_PROBE_TOKEN: ${{ secrets.STATUS_SERVICE_PROBE_TOKEN }}
        run: node scripts/monitor.mjs
      - name: Commit only the validated public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/status.json
          if git diff --cached --quiet -- public/status.json; then exit 0; fi
          git diff --cached --check -- public/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(status): record observed service checks' --only -- public/status.json
          # GITHUB_TOKEN pushes do not recursively trigger the push workflow.
          # A concurrent remote update rejects this push; never overwrite or force-push it.
          git push origin HEAD:main

  deploy:
    needs: monitor
    # Initial/source pushes can publish Unknown without the monitoring secret.
    # A failed/manual/scheduled probe retains the previously deployed timestamped snapshot.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.monitor.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current published source and snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify fixture-only monitor and history contracts on source changes
        if: github.event_name == 'push'
        run: node --test tests/*.test.mjs
      - name: Enable HTTPS when the custom certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if timeout 20s gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -F https_enforced=true >/dev/null 2>&1; then
            echo 'HTTPS enforcement enabled.'
          else
            echo 'HTTPS enforcement pending certificate readiness; deployment continues.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build independent static assets
        run: node scripts/build.mjs
      - name: Upload small Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Deploy independent status page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
